[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vso-agent"
version = "0.1.0"
description = "Draft-only copilot for accredited VSOs supporting VFW posts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dlhiwig" }]
dependencies = []

[project.optional-dependencies]
chat = ["openai>=1.40.0", "python-dotenv>=1.0.1"]

[project.scripts]
vso-agent = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
